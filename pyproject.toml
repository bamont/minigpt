[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minigpt"
version = "0.1.0"
description = "A GPT language model built from scratch in PyTorch."
requires-python = ">=3.10"
dependencies = ["regex", "torch", "numpy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
