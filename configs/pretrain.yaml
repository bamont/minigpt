data:
  train: data/train.bin
  val: data/val.bin

model:
  vocab_size: 4096
  block_size: 512
  n_layer: 8
  n_head: 8
  n_embd: 512
  dropout: 0.0

train:
  out_dir: runs/pretrain
  max_steps: 20000
  batch_size: 32
  grad_accum_steps: 2
  learning_rate: 0.0006
  min_lr_ratio: 0.1
  warmup_steps: 500
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: float16
  eval_interval: 500
  eval_iters: 50
  log_interval: 20
  checkpoint_interval: 500
  time_limit_minutes: 690
  seed: 1337
  device: auto
